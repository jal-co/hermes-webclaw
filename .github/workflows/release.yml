name: Release

on:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify plugin files exist
        run: |
          test -f scripts/plugin.yaml   || { echo "::error::scripts/plugin.yaml missing"; exit 1; }
          test -f scripts/__init__.py    || { echo "::error::scripts/__init__.py missing"; exit 1; }
          test -f scripts/provider.py    || { echo "::error::scripts/provider.py missing"; exit 1; }
          test -f scripts/install.sh     || { echo "::error::scripts/install.sh missing"; exit 1; }
          echo "All plugin files present"

      - name: Package plugin
        run: |
          STAGING="hermes-webclaw-${{ steps.version.outputs.version }}"
          mkdir -p "$STAGING"
          cp scripts/plugin.yaml  "$STAGING/"
          cp scripts/__init__.py  "$STAGING/"
          cp scripts/provider.py  "$STAGING/"
          cp scripts/install.sh   "$STAGING/"
          cp LICENSE               "$STAGING/" 2>/dev/null || true
          cp README.md             "$STAGING/" 2>/dev/null || true
          tar -czf "${STAGING}.tar.gz" "$STAGING"
          echo "Package: ${STAGING}.tar.gz"
          ls -lh "${STAGING}.tar.gz"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: hermes-webclaw-${{ steps.version.outputs.version }}.tar.gz
