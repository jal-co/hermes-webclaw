name: hermes-webclaw
version: 1.0.0
description: "WebClaw web search + content extraction + crawl. Drop-in Firecrawl replacement with native v1 API support. Requires WEBCLAW_API_KEY — sign up at https://webclaw.io."
author: jal-co
kind: backend
provides_web_providers:
  - webclaw
requires_env:
  - name: WEBCLAW_API_KEY
    description: "WebClaw API key (wc_...) — get one at https://webclaw.io"
    url: "https://webclaw.io"
